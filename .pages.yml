# Pages CMS (https://pagescms.org): a web editor for the same files the site is built from.
# Jasmine signs in at https://app.pagescms.org with GitHub and opens chawlz7/jasminemote.com.
# Every save is a commit to main, and the site rebuilds in about a minute.
# Keep these fields in step with the schemas in src/content.config.ts; the build rejects anything that
# doesn't match, so a mistake shows up as a failed build instead of a broken page.
#
# Formatting you can use in any text box: <em>word</em> for italic (in a heading it shows in violet),
# <strong>word</strong> for bold, <a href="https://…">link</a> for a link.

media:
  - name: files
    label: Photos and files
    input: public
    output: /
    categories: [image, document]

content:
  - name: homepage
    label: Homepage
    type: file
    path: src/content/homepage.yaml
    format: yaml
    fields:
      - name: photo
        label: Headshot
        type: object
        fields:
          - { name: src, label: Photo, type: image, options: { media: files } }
          - { name: alt, label: Photo description (for screen readers), type: string }
      - name: hero
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: bio, label: Short bio, type: text }
      - name: credentials
        label: The four links under your bio (in this order — newsletter, therapy, research, writing)
        type: object
        list: { min: 4, max: 4 }
        fields:
          - { name: label, label: Title, type: string }
          - { name: sub, label: Detail line, type: string }
          - { name: url, label: Link, type: string }
          - { name: external, label: Opens another site, type: boolean }
          - { name: icon, type: string, hidden: true }
      - name: newsletter
        label: Newsletter section
        type: object
        fields:
          - { name: intro, label: Introduction, type: text }
      - name: about
        label: About section
        type: object
        fields:
          - { name: pullquote, label: Pull quote, type: text }
          - { name: body, label: Paragraphs, type: text, list: true }
          - { name: tags, label: Tags, type: string, list: true, description: "Values tags (affirmative, anti-racist, transitions) show in sage; the rest in lavender." }
          - name: credentials
            label: Credentials beside the bio
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Main line, type: string }
              - { name: sub, label: Detail line, type: string }
      - name: therapy
        label: Therapy section
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: body, label: Paragraph, type: text }
          - { name: specialties, label: What you treat, type: string, list: true }
          - name: card
            label: "\"Ready to get started?\" card"
            type: object
            fields:
              - { name: title, label: Title, type: string }
              - { name: body, label: Text, type: text }
              - { name: cta_text, label: Button label, type: string }
              - { name: cta_url, label: Button link, type: string }
      - name: sections
        label: Section headings
        type: object
        fields:
          - { name: newsletter_heading, label: Newsletter, type: string }
          - { name: about_heading, label: About, type: string }
          - { name: writing_heading, label: Writing, type: string }
          - { name: research_heading, label: Research, type: string }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google (about 160 characters show), type: text }

  - name: therapy
    label: Therapy page
    type: file
    path: src/content/therapy.yaml
    format: yaml
    fields:
      - name: page
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: subhead, label: Introduction, type: text }
          - { name: affiliation, label: Affiliation line, type: string }
          - { name: cta_label, label: Button label, type: string }
          - { name: cpg_url, label: Button link (CPG profile), type: string }
      - name: specialties
        label: What I treat
        type: object
        fields:
          - { name: section_title, label: Heading, type: string }
          - { name: items, label: Items, type: string, list: true }
      - name: cta_card
        label: "\"Ready to get started?\" card"
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: body, label: Text, type: text }
          - { name: cta_label, label: Button label, type: string }
          - { name: cpg_url, label: Button link, type: string }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google, type: text }

  - name: writingPage
    label: Writing page
    type: file
    path: src/content/writingPage.yaml
    format: yaml
    fields:
      - name: page
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: subhead, label: Introduction, type: text }
      - name: newsletter_callout
        label: Newsletter box
        type: object
        fields:
          - { name: kicker, label: Small line, type: string }
          - { name: headline, label: Name, type: string }
          - { name: body, label: Text, type: text }
          - { name: url, label: Link, type: string }
          - { name: cta, label: Button label, type: string }
      - name: sections
        label: Section headings
        type: object
        fields:
          - { name: essays_heading, label: Essays, type: string }
          - { name: press_heading, label: Press, type: string }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google, type: text }

  - name: writing
    label: Writing & press list
    type: file
    path: src/content/writing.json
    format: json
    list: true
    fields:
      - name: category
        label: Kind
        type: select
        options: { values: [{ value: writing, label: Essay or article }, { value: press, label: Press or interview }] }
      - { name: source, label: Outlet, type: string }
      - { name: title, label: Title, type: string }
      - { name: url, label: Link, type: string }
      - { name: note, label: Tag (optional, e.g. Interview), type: string }
      - { name: date, label: Date (press only, e.g. April 2022), type: string }

  - name: research
    label: Research page
    type: file
    path: src/content/research.yaml
    format: yaml
    fields:
      - name: statement
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: body, label: Research statement (a blank line starts a new paragraph), type: text }
          - { name: affiliation, label: Affiliation line, type: string }
      - name: stats
        label: Numbers row
        type: object
        list: true
        fields:
          - { name: number, label: Number, type: string }
          - { name: label, label: Label, type: string }
      - name: focus_areas
        label: Research focus areas
        type: object
        list: true
        fields:
          - { name: id, label: Number (publications use it to appear under this area), type: number }
          - { name: title, label: Title, type: string }
          - { name: description, label: Description, type: text }
      - name: sections
        label: Section headings
        type: object
        fields:
          - { name: focus_heading, label: Focus areas, type: string }
          - { name: publications_heading, label: Publications, type: string }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google, type: text }

  - name: publications
    label: Publications
    type: file
    path: src/content/publications.json
    format: json
    list: true
    fields:
      - { name: year, label: Year, type: number }
      - { name: authors, label: Authors, type: string, description: "As cited, e.g. Mote, J., Gard, D. E., & Fulford, D." }
      - { name: title, label: Title, type: text }
      - { name: journal, label: Journal, volume, pages, type: string }
      - { name: url, label: Link, type: string }
      - { name: focus_area, label: Show as noteworthy under focus area (1–4, or leave empty), type: number }

  - name: resources
    label: Resources page
    type: file
    path: src/content/resources.yaml
    format: yaml
    fields:
      - name: page
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: subhead, label: Introduction, type: text }
      - name: phd_guide
        label: PhD guide
        type: object
        fields:
          - { name: kicker, label: Small line, type: string }
          - { name: headline, label: Title, type: string }
          - { name: body, label: Text, type: text }
          - { name: url, label: Link, type: string }
          - { name: cta, label: Button label, type: string }
      - { name: crisis_intro, label: Crisis line note, type: text }
      - name: early_psychosis
        label: Early psychosis services
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: detail, label: Detail, type: string }
          - { name: url, label: Link, type: string }
      - name: general_mental_health
        label: General mental health
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: detail, label: Detail, type: string }
          - { name: url, label: Link, type: string }
      - name: sections
        label: Section headings
        type: object
        fields:
          - { name: phd_heading, label: PhD guide, type: string }
          - { name: ma_resources_heading, label: Massachusetts resources, type: string }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google, type: text }

  - name: workWithMe
    label: Work With Me page
    type: file
    path: src/content/workWithMe.yaml
    format: yaml
    fields:
      - name: page
        label: Top of the page
        type: object
        fields:
          - { name: eyebrow, label: Small line above the headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: subhead, label: Introduction, type: text }
      - name: therapy
        label: For therapy clients
        type: object
        fields:
          - { name: eyebrow, label: Section heading, type: string }
          - { name: headline, label: Card title, type: string }
          - { name: body, label: Text, type: text }
          - { name: instruction, label: Highlighted instruction, type: text }
          - { name: cta_label, label: Main button label, type: string }
          - { name: cpg_url, label: Main button link (CPG), type: string }
          - { name: pt_label, label: Second button label, type: string }
          - { name: pt_url, label: Second button link (Psychology Today), type: string }
          - { name: how_it_works_title, label: Steps heading, type: string }
          - { name: how_it_works_steps, label: Steps, type: string, list: true }
      - name: collaboration
        label: Collaboration, press & media
        type: object
        fields:
          - { name: eyebrow, label: Section heading, type: string }
          - { name: headline, label: Title, type: string }
          - { name: body, label: Text, type: text }
      - name: seo
        label: Search results
        type: object
        fields:
          - { name: description, label: Description shown by Google, type: text }
